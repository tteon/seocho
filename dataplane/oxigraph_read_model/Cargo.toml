[package]
name = "seocho-oxigraph-read-model"
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
# The daemon reloads a versioned ontology bundle at boot; it does not own
# canonical state, so the in-memory store avoids an unnecessary RocksDB/clang
# runtime dependency in this first sidecar slice.
oxigraph = { version = "0.5.9", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
