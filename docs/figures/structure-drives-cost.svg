<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="720" height="400"
     role="img" aria-labelledby="t d">
  <title id="t">What grew and what did not, across a thousandfold increase in volume</title>
  <desc id="d">Four panels comparing the uniform and power-law arms at scale factors 1 to 1000.
  Maximum degree stays between 26 and 31 on the uniform arm while rising from 1,540 to 154,846
  on the power-law arm. Incidental three-cycles stay between 44 and 57 on the uniform arm while
  rising from 865 to 694,682. Input tokens sent to the model stay between 97 and 150 on both
  arms with no trend, so context volume does not grow with scale. Disclosure of a truncated
  answer is zero out of twenty across the entire grid.</desc>

  <style>
    .surface { fill: #ffffff; }
    .card    { fill: #ffffff; stroke: #e1e5ea; }
    .grid    { stroke: #eceff3; stroke-width: 1; }
    .axis    { fill: #6b7684; }
    .label   { fill: #47515f; }
    .value   { fill: #12151a; }
    .s1f     { fill: #2a78d6; } .s1s { stroke: #2a78d6; }
    .s2f     { fill: #eb6834; } .s2s { stroke: #eb6834; }
    .flat    { fill: #6b7684; }
    text     { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
               font-variant-numeric: tabular-nums; }
    @media (prefers-color-scheme: dark) {
      .surface { fill: #1a1d22; }
      .card    { fill: #1a1d22; stroke: #2b3038; }
      .grid    { stroke: #23272e; }
      .axis    { fill: #8b95a2; }
      .label   { fill: #b3bcc8; }
      .value   { fill: #f1f3f6; }
      .s1f     { fill: #3987e5; } .s1s { stroke: #3987e5; }
      .s2f     { fill: #d95926; } .s2s { stroke: #d95926; }
      .flat    { fill: #8b95a2; }
    }
  </style>

  <rect class="surface" x="0" y="0" width="720" height="400"/>

  <text class="value" x="24" y="26" font-size="13" font-weight="600">Volume held the same in both arms. Only the distribution differs.</text>
  <text class="label" x="24" y="44" font-size="11">Edge counts are identical at each scale — 10,042 / 100,042 / 1,000,042 / 10,000,042.</text>

  <g font-size="11.5">
    <rect class="s2f" x="24" y="378" width="10" height="10" rx="2"/>
    <text class="label" x="40" y="387">power-law + closure + cycles</text>
    <rect class="s1f" x="262" y="378" width="10" height="10" rx="2"/>
    <text class="label" x="278" y="387">uniform attachment</text>
    <text class="axis" x="696" y="387" font-size="10" text-anchor="end">SF 1 → 10 → 100 → 1000 left to right in each panel</text>
  </g>

  <!-- ══ panel 1: max degree (log) ══ -->
  <rect class="card" x="24" y="58" width="324" height="148" rx="3"/>
  <text class="label" x="38" y="76" font-size="11" font-weight="600">Maximum degree</text>
  <text class="axis" x="38" y="90" font-size="10">log scale · 26 → 31 against 1,540 → 154,846</text>
  <!-- power-law: 1540, 7060, 33049, 154846 -->
  <polyline class="s2s" fill="none" stroke-width="2" points="66,158 138,134 210,111 282,88"/>
  <g class="s2f">
    <circle cx="66" cy="158" r="4"/><circle cx="138" cy="134" r="4"/>
    <circle cx="210" cy="111" r="4"/><circle cx="282" cy="88" r="4"/>
  </g>
  <text class="value" x="282" y="80" font-size="10.5" font-weight="600" text-anchor="end">154,846</text>
  <!-- uniform: 26, 26, 31, 31 -->
  <polyline class="s1s" fill="none" stroke-width="2" points="66,192 138,192 210,190 282,190"/>
  <g class="s1f">
    <circle cx="66" cy="192" r="4"/><circle cx="138" cy="192" r="4"/>
    <circle cx="210" cy="190" r="4"/><circle cx="282" cy="190" r="4"/>
  </g>
  <text class="value" x="292" y="194" font-size="10.5" font-weight="600">31</text>

  <!-- ══ panel 2: incidental 3-cycles (log) ══ -->
  <rect class="card" x="372" y="58" width="324" height="148" rx="3"/>
  <text class="label" x="386" y="76" font-size="11" font-weight="600">Incidental 3-cycles — the distractors</text>
  <text class="axis" x="386" y="90" font-size="10">log scale · 44 → 57 against 865 → 694,682</text>
  <!-- power-law: 865, 7144, 69764, 694682 -->
  <polyline class="s2s" fill="none" stroke-width="2" points="414,163 486,138 558,113 630,88"/>
  <g class="s2f">
    <circle cx="414" cy="163" r="4"/><circle cx="486" cy="138" r="4"/>
    <circle cx="558" cy="113" r="4"/><circle cx="630" cy="88" r="4"/>
  </g>
  <text class="value" x="630" y="80" font-size="10.5" font-weight="600" text-anchor="end">694,682</text>
  <!-- uniform: 57, 44, 45, 47 -->
  <polyline class="s1s" fill="none" stroke-width="2" points="414,192 486,194 558,194 630,193"/>
  <g class="s1f">
    <circle cx="414" cy="192" r="4"/><circle cx="486" cy="194" r="4"/>
    <circle cx="558" cy="194" r="4"/><circle cx="630" cy="193" r="4"/>
  </g>
  <text class="value" x="640" y="197" font-size="10.5" font-weight="600">47</text>

  <!-- ══ panel 3: input tokens — the null result ══ -->
  <rect class="card" x="24" y="220" width="324" height="148" rx="3"/>
  <text class="label" x="38" y="238" font-size="11" font-weight="600">Input tokens sent to the model</text>
  <text class="axis" x="38" y="252" font-size="10">linear 0–200 · no trend in either arm</text>
  <g class="grid"><line x1="38" y1="340" x2="334" y2="340"/><line x1="38" y1="292" x2="334" y2="292"/></g>
  <text class="axis" x="34" y="344" font-size="9.5" text-anchor="end">0</text>
  <text class="axis" x="34" y="296" font-size="9.5" text-anchor="end">100</text>
  <!-- power-law: 123,137,97,98 -->
  <polyline class="s2s" fill="none" stroke-width="2" points="66,281 138,274 210,293 282,293"/>
  <g class="s2f">
    <circle cx="66" cy="281" r="4"/><circle cx="138" cy="274" r="4"/>
    <circle cx="210" cy="293" r="4"/><circle cx="282" cy="293" r="4"/>
  </g>
  <!-- uniform: 142,126,141,150 -->
  <polyline class="s1s" fill="none" stroke-width="2" points="66,272 138,280 210,272 282,268"/>
  <g class="s1f">
    <circle cx="66" cy="272" r="4"/><circle cx="138" cy="280" r="4"/>
    <circle cx="210" cy="272" r="4"/><circle cx="282" cy="268" r="4"/>
  </g>
  <text class="value" x="38" y="360" font-size="10.5" font-weight="600">97–150 tokens throughout</text>
  <text class="axis" x="38" y="372" font-size="10">the row cap holds, so context is not what grows</text>

  <!-- ══ panel 4: disclosure — the categorical zero ══ -->
  <rect class="card" x="372" y="220" width="324" height="148" rx="3"/>
  <text class="label" x="386" y="238" font-size="11" font-weight="600">Truncated answers that said so</text>
  <text class="axis" x="386" y="252" font-size="10">answers whose true result exceeds the 50-row cap</text>
  <text class="value" x="386" y="300" font-size="38" font-weight="600">0 / 20</text>
  <text class="label" x="386" y="322" font-size="11">across all eight grid points</text>
  <text class="axis" x="386" y="344" font-size="10">the largest such answer is 908,649 accounts,</text>
  <text class="axis" x="386" y="357" font-size="10">returned as 50 rows with no qualification —</text>
  <text class="axis" x="386" y="370" font-size="10">and nothing in the pipeline scores this today</text>
</svg>
