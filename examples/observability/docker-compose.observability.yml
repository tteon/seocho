# ADR-0144: lightweight local OpenTelemetry observability stack.
#
# Four containers (Collector + Tempo + Prometheus + Grafana). Since ADR-0172
# removed the Opik backend this is the only observability stack, local and
# otherwise — there is no vendor tier above it. Pattern borrowed from LMCache's
# examples/observability (NOT a manifest copy): SEOCHO services push OTLP to the
# collector by container name, so no host.docker.internal is needed.
#
# Run alongside the main stack (shares the external seocho-net created by
# docker-compose.yml):
#
#   docker compose -f examples/observability/docker-compose.observability.yml \
#       --profile observability up -d
#
# Then point SEOCHO at the collector (in-compose app → otel-collector:4317;
# host-run app → localhost:4317, the default):
#
#   SEOCHO_TRACE_BACKEND=otlp
#   SEOCHO_TRACE_OTLP_ENDPOINT=http://otel-collector:4317   # in-compose
#
# Grafana: http://localhost:3000 (anonymous admin — DEV ONLY; harden for prod).
# Image tags are pinned (ADR-0144); bump deliberately.

services:
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.119.0
    container_name: seocho-otel-collector
    profiles: ["observability"]
    command: ["--config=/etc/otel-collector.yaml"]
    volumes:
      - ./otel-collector.yaml:/etc/otel-collector.yaml:ro
    ports:
      - "${SEOCHO_BIND_HOST:-127.0.0.1}:${OTLP_GRPC_PORT:-4317}:4317"
      - "${SEOCHO_BIND_HOST:-127.0.0.1}:${OTLP_HTTP_PORT:-4318}:4318"
      - "${SEOCHO_BIND_HOST:-127.0.0.1}:${OTEL_METRICS_PORT:-8889}:8889"
    networks: [graphrag-net]
    depends_on: [tempo]

  tempo:
    image: grafana/tempo:2.7.2
    container_name: seocho-tempo
    profiles: ["observability"]
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./tempo.yaml:/etc/tempo.yaml:ro
      - tempo-data:/var/tempo
    ports:
      - "${SEOCHO_BIND_HOST:-127.0.0.1}:${TEMPO_PORT:-3200}:3200"
    networks: [graphrag-net]

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: seocho-prometheus
    profiles: ["observability"]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus-rules.yml:/etc/prometheus/seocho-rules.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "${SEOCHO_BIND_HOST:-127.0.0.1}:${PROMETHEUS_PORT:-9091}:9090"
    networks: [graphrag-net]

  grafana:
    image: grafana/grafana:11.5.1
    container_name: seocho-grafana
    profiles: ["observability"]
    environment:
      # DEV ONLY: anonymous admin, login disabled. Do not use in production.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Admin"
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "${SEOCHO_BIND_HOST:-127.0.0.1}:${GRAFANA_PORT:-3000}:3000"
    networks: [graphrag-net]
    depends_on: [prometheus, tempo]

networks:
  # Declared IDENTICALLY to the root compose's network so that, when this file is
  # pulled in via `include:` from the root docker-compose.yml, the two definitions
  # merge cleanly into one (project-created) `seocho-net` — no external/driver
  # union that would stop the core stack from creating its own network. The 4
  # services attach to it; the profile keeps them off unless requested.
  graphrag-net:
    name: seocho-net
    driver: bridge

volumes:
  tempo-data:
  prometheus-data:
  grafana-data:
