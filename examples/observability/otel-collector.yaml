# OTel Collector: receive OTLP from SEOCHO, fan out to Tempo (traces) and
# expose metrics for Prometheus to scrape. ADR-0144.
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318
  # Host saturation (CPU, memory, load, paging): the golden signal the app
  # cannot report about itself. Container-scoped unless the compose file
  # mounts the host root; either way the collector, not the app, owns it.
  hostmetrics:
    collection_interval: 15s
    scrapers:
      cpu:
      memory:
      load:
      paging:

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 256
  batch:
    timeout: 1s
    send_batch_size: 512

exporters:
  otlp/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true
  prometheus:
    endpoint: 0.0.0.0:8889
    # Turn OTel resource attributes into metric labels (service.name, etc.).
    resource_to_telemetry_conversion:
      enabled: true

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlp/tempo]
    metrics:
      receivers: [otlp, hostmetrics]
      processors: [memory_limiter, batch]
      exporters: [prometheus]
  # Self-telemetry on :8888, scraped by Prometheus: without it the pipeline's
  # own drops are invisible and SeochoTelemetryExportFailure has no context.
  telemetry:
    metrics:
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
