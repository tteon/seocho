global:
  scrape_interval: 15s

rule_files:
  - /etc/prometheus/seocho-rules.yml

scrape_configs:
  - job_name: seocho-otel-collector
    static_configs:
      - targets: ["otel-collector:8889"]

  - job_name: seocho-postgresql
    static_configs:
      - targets: ["postgres-exporter:9187"]

  - job_name: seocho-etcd
    metrics_path: /metrics
    static_configs:
      # Matches the validated local profile. Production deployments should
      # replace this with service discovery for every etcd member.
      - targets: ["host.docker.internal:52379"]

  # DozerDB Community 5.26.3.0 exposes no native Prometheus endpoint and
  # registers no org.neo4j MBeans (measured 2026-08-15). Server saturation
  # comes from two proxies instead: the Bolt-polling exporter (JVM heap/GC,
  # buffer pools, active transactions) and cadvisor's per-container block
  # I/O, which is where page-cache misses become visible. Client-side
  # latency is db.client.operation.duration, emitted by the SDK.
  - job_name: seocho-dozerdb-bolt
    static_configs:
      - targets: ["dozerdb-bolt-exporter:9141"]

  - job_name: seocho-cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]
