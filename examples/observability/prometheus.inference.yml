# Optional standalone scrape configuration. Replace targets with the serving
# network endpoints; do not add arbitrary tenant/request IDs as metric labels.
global:
  scrape_interval: 5s
scrape_configs:
  - job_name: vllm
    static_configs:
      - targets: ["vllm:8000"]
  - job_name: dcgm
    static_configs:
      - targets: ["dcgm-exporter:9400"]
