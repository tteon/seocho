# Prometheus scrapes the collector's Prometheus exposition endpoint, where
# SEOCHO's OTLP metrics (seocho_*, ADR-0144 §6 follow-ups) are re-exposed.
global:
  scrape_interval: 15s

rule_files:
  - /etc/prometheus/seocho-rules.yml

scrape_configs:
  - job_name: seocho-otel-collector
    static_configs:
      - targets: ["otel-collector:8889"]
  # The collector's own health: queue drops, exporter failures, memory-limiter
  # refusals. A telemetry pipeline that cannot report on itself hides exactly
  # the failures it exists to surface.
  - job_name: seocho-otel-collector-self
    static_configs:
      - targets: ["otel-collector:8888"]
