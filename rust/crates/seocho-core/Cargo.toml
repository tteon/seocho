[package]
name = "seocho-core"
version = "0.1.0"
edition = "2021"

[lib]
name = "seocho_core"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.23" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
default = []
extension-module = ["pyo3/extension-module"]

[lints]
workspace = true

