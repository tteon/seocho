# Local observability for benchmark runs.
#
# The benchmark process serves OpenTelemetry metrics on a Prometheus endpoint
# (default :9464). A separate Prometheus/Grafana pair from another checkout may
# already hold 9090/3001, so this stack uses 9092/3002. Prometheus scrapes the host; Grafana reads Prometheus. Both
# bind to loopback only — this is a local analysis stack, not a service.
#
#   docker compose -f scripts/benchmarks/observability/docker-compose.yml up -d
#   SEOCHO_PROM_PORT=9464 python3 scripts/benchmarks/finder_4arm_sample.py ...
#   open http://localhost:3002  (anonymous admin, no login)
#
# Metrics are the live view. The durable record is telemetry.jsonl next to the
# run's aggregate.json, so a paper number never depends on this stack running.
services:
  prometheus:
    image: prom/prometheus:v3.1.0
    container_name: seocho-bench-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=30d
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:9092:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.5.1
    container_name: seocho-bench-grafana
    depends_on: [prometheus]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_USERS_DEFAULT_THEME: light
    volumes:
      - ./grafana-datasource.yml:/etc/grafana/provisioning/datasources/prometheus.yml:ro
      - ./grafana-dashboards.yml:/etc/grafana/provisioning/dashboards/local.yml:ro
      - ./dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:3002:3000"
    restart: unless-stopped

volumes:
  prometheus-data:
  grafana-data:
