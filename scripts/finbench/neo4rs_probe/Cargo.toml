# Standalone crate on purpose. The probe answers one question — how much of a query's
# wall-clock is the Python driver rather than the server — and answering it must not add a
# Rust build step to a Python project that does not otherwise need one. Results leave as
# JSON on stdout; nothing here is imported by seocho.
[package]
name = "neo4rs_probe"
version = "0.1.0"
edition = "2021"

[dependencies]
neo4rs = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
serde_json = "1"

[profile.release]
opt-level = 3
